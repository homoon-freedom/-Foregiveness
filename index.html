<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기적수업 내면 정화 프로그램</title>
    <!-- html2canvas 라이브러리 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #555555;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --accent: #4a6fa5;
            --modal-bg: rgba(0, 0, 0, 0.8);
            --modal-content-bg: #1e1e1e;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            line-height: 1.6;
            box-sizing: border-box;
        }

        .breathe-bg {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(74,111,165,0.15) 0%, rgba(18,18,18,1) 60%);
            animation: breathe 8s infinite ease-in-out;
            z-index: 0;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            width: 90%;
            text-align: center;
            padding: 30px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            margin-bottom: 75px;
        }

        .step-indicator {
            font-size: 0.95rem;
            color: var(--accent);
            margin-bottom: 8px;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .title {
            font-size: 1.6rem;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .script-text {
            font-size: 1.1rem;
            color: var(--text-muted);
            white-space: pre-wrap;
            margin-bottom: 20px;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease-in-out;
            word-break: keep-all;
        }

        /* --- 상단 고정 네비게이션 컨트롤 바 --- */
        .top-controls {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-sizing: border-box;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        #prevBtn, #nextBtn {
            flex: 0 0 100px;
            text-align: center;
        }

        .btn-audio {
            flex: 1;
            text-align: center;
            border-color: #4CAF50;
            color: #4CAF50;
            font-weight: 500;
        }

        .btn-audio:hover {
            background-color: #4CAF50;
            color: white;
        }

        /* --- 하단 고정 컨트롤 바 (기록, 설정) --- */
        .controls {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(10px);
            padding: 12px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-sizing: border-box;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .controls button {
            flex: 1;
            text-align: center;
            box-sizing: border-box;
        }

        button {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--accent);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        button:hover {
            background-color: var(--accent);
            color: #fff;
        }

        button:disabled {
            border-color: #333;
            color: #555;
            cursor: not-allowed;
            background-color: transparent;
        }

        /* --- 공통 모달 스타일 --- */
        .modal {
            display: none; 
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-bg);
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
        }

        /* --- 기록하기 모달 --- */
        .record-content {
            background-color: var(--modal-content-bg);
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            position: relative;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .modal.show .record-content { transform: translateY(0); }
        .record-content .close-btn { color: #aaa; }
        .record-content .close-btn:hover { color: #fff; }

        .record-content h2 {
            margin-top: 0;
            font-size: 1.3rem;
            font-weight: 500;
            color: var(--accent);
            margin-bottom: 15px;
            word-break: keep-all;
        }

        textarea {
            width: 100%;
            height: 260px;
            background-color: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        textarea:focus { outline: none; border-color: var(--accent); }

        .save-btn {
            width: 100%;
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 12px;
        }

        /* --- 설정 모달 스타일 --- */
        .settings-content {
            background-color: #1e1e1e;
            color: #e0e0e0;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }
        .modal.show .settings-content { transform: translateY(0); }

        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .settings-header h2 {
            font-size: 1.2rem;
            margin: 0;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-group label {
            display: block;
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .settings-content input, .settings-content select, .settings-content textarea {
            flex: 1;
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .settings-content select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 35px;
        }

        .btn-blue { background-color: #007bff; color: white; border: none; border-radius: 8px; padding: 0 16px; cursor: pointer; font-weight: 500; font-family: inherit; }
        .btn-blue:hover { background-color: #0056b3; }

        .btn-red { background-color: #ff3b30; color: white; border: none; border-radius: 8px; padding: 0 16px; cursor: pointer; font-weight: 500; font-family: inherit; }
        .btn-red:hover { background-color: #d32f2f; }

        .btn-orange { background-color: #ff9500; color: white; border: none; border-radius: 8px; padding: 0 16px; cursor: pointer; font-weight: 500; font-family: inherit; }
        .btn-orange:hover { background-color: #e08500; }

        .divider {
            border: none;
            border-top: 1px dashed #444;
            margin: 20px 0;
        }

        /* --- 이북(E-Book) 모달 --- */
        .ebook-content {
            background-color: var(--modal-content-bg);
            color: var(--text-main);
            padding: 30px;
            width: 90%;
            max-width: 400px;
            height: 80vh;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            position: relative;
            overflow-y: auto;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
            font-family: inherit; 
            display: flex;
            flex-direction: column;
        }

        .modal.show .ebook-content { transform: translateY(0); }
        .ebook-content .close-btn { color: #aaa; }
        .ebook-content .close-btn:hover { color: #fff; }

        .ebook-title-page {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        .ebook-title-page h1 {
            font-size: 1.3rem;
            margin: 0 0 10px 0;
            font-weight: 500;
            color: var(--accent);
        }

        .ebook-title-page p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
            line-height: 1.5;
        }

        .ebook-chapter {
            margin-bottom: 25px;
        }

        .ebook-chapter-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .ebook-chapter-content {
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            color: var(--text-main);
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            word-break: keep-all;
        }

        .empty-record {
            color: var(--text-muted);
            font-style: italic;
        }

        /* --- 이미지 공유 버튼 스타일 --- */
        .image-share-btn {
            margin-top: 20px;
            background-color: #fee500;
            color: #191919;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }
        .image-share-btn:hover {
            background-color: #f3dc00;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="breathe-bg"></div>

    <!-- 상단 고정 컨트롤 바 (이전 단계, 오디오 재생, 다음 단계) -->
    <div class="top-controls">
        <button id="prevBtn" disabled>이전 단계</button>
        <button id="playAudioBtn" class="btn-audio">오디오 재생</button>
        <button id="nextBtn">다음 단계</button>
    </div>

    <div class="container">
        <div class="step-indicator" id="stepIndicator">0단계</div>
        <h1 class="title" id="stepTitle">고요함 속으로 들어가기</h1>
        <div class="script-text" id="scriptText"></div>
    </div>

    <!-- 하단 고정 컨트롤 바 (기록, 설정) -->
    <div class="controls">
        <button id="recordBtn">현재 느낌 기록</button>
        <button id="openSettingsBtn">사용자 및 사건 설정</button>
    </div>

    <!-- 오디오 요소 -->
    <audio id="stepAudio"></audio>

    <!-- 기록하기 모달 -->
    <div id="recordModal" class="modal">
        <div class="record-content">
            <span class="close-btn" id="closeRecordModalBtn">&times;</span>
            <h2 id="modalTitle">기록하기</h2>
            <textarea id="modalTextarea" placeholder="이 단계에서 올라오는 감정이나 떠오르는 생각들을 있는 그대로 자유롭게 적어보세요..."></textarea>
            <button id="saveRecordBtn" class="save-btn">저장하기</button>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div id="settingsModal" class="modal">
        <div class="settings-content">
            <span class="close-btn" id="closeSettingsModalBtn">&times;</span>
            <div class="settings-header">
                <h2>⚙️ 설정</h2>
            </div>

            <div class="setting-group">
                <label>1. 사용자</label>
                <div class="input-row">
                    <input type="text" id="userInput" placeholder="이름">
                    <button class="btn-blue" id="registerUserBtn">등록</button>
                </div>
                <div class="input-row">
                    <select id="userSelect">
                        <option value="">사용자를 선택하세요</option>
                    </select>
                    <button class="btn-red" id="deleteUserBtn">삭제</button>
                </div>
            </div>

            <hr class="divider">

            <div class="setting-group">
                <label>2. 사건</label>
                <div class="input-row">
                    <input type="text" id="eventInput" placeholder="사건명">
                    <button class="btn-blue" id="addEventBtn">추가</button>
                </div>
                <div class="input-row">
                    <select id="eventSelect">
                        <option value="">사건을 선택하세요</option>
                    </select>
                    <button class="btn-orange" id="editEventBtn">수정</button>
                    <button class="btn-red" id="deleteEventBtn">삭제</button>
                </div>
            </div>

            <hr class="divider">

            <div class="setting-group" style="margin-bottom: 0;">
                <label>3. 사건 내용 입력</label>
                <textarea id="eventDetailTextarea" placeholder="선택된 사건에 대한 구체적인 내용을 입력하세요..." style="width: 100%; height: 100px; resize: none; box-sizing: border-box;"></textarea>
            </div>
        </div>
    </div>

    <!-- 이북(요약) 모달 -->
    <div id="ebookModal" class="modal">
        <div class="ebook-content" id="ebookPrintArea">
            <span class="close-btn" id="closeEbookModalBtn">&times;</span>
            
            <div class="ebook-title-page">
                <h1 id="ebookHeaderTitle">나의 내면 정화 일지</h1>
                <p id="ebookDate"></p>
            </div>

            <div id="ebookChapters" style="flex: 1; overflow-y: visible;"></div>

            <!-- 이미지 카카오톡/메신저 공유 버튼 -->
            <button id="imageShareBtn" class="image-share-btn">💬 일지 이미지로 공유하기</button>
        </div>
    </div>

    <script>
        const steps = [
            {
                indicator: "0단계",
                title: "고요함 속으로 들어가기",
                script: "본격적인 정화의 시간을 갖기 전, 먼저 지금 이 순간으로 당신을 초대합니다.\n편안한 자세로 앉아, 가만히 눈을 감아보세요.\n이제 천천히, 코를 통해 깊게 숨을 들이마십니다. \n내 몸 안으로 맑은 공기가 들어오는 것을 느껴봅니다.\n그리고 입을 통해 천천히, 끝까지 숨을 내쉽니다.\n내쉴 때마다, 어깨의 긴장과 머릿속의 복잡한 생각들이 숨결을 타고 함께 빠져나간다.\n다시 한번 깊게 들이마시고... 길게 내쉽니다.\n외부로 향해 있던 나의 모든 감각과 에너지를, 이제 오롯이 내 안으로 거두어들입니다. \n당신은 지금 완벽하게 안전하며, 이 시간은 오직 당신 내면의 평화를 위한 시간입니다.",
                audioSrc: "audio/step0.mp3"
            },
            {
                indicator: "1단계",
                title: "투사 거두어들기",
                script: "이제 마음의 준비가 되었다면, 지금 당신의 마음을 가장 어지럽히는 그 사람, 혹은 그 상황을 가만히 떠올려 봅니다.\n우리는 흔히 '저 사람 때문에', 혹은 '이 피할 수 없는 상황 때문에' 내가 고통받고 있다고 믿습니다.\n하지만 기적수업은 말합니다. 당신이 느끼는 고통과 두려움의 진짜 원인은 밖에 있지 않다고요.\n밖으로 향하던 시선을 거두어, 내 안으로 가져옵니다.\n'나를 화나게 한 것은 저 상황이 아니라, 저 상황에 대한 내 안의 판단이었구나.'\n이 진실을 외부 탓으로 돌리지 않고, 있는 그대로 가만히 바라보세요.",
                audioSrc: "audio/step1.mp3"
            },
            {
                indicator: "2단계",
                title: "기꺼이 놓아버리기",
                script: "이제 내 안에서 올라오는 그 불편한 감정과 판단을, 억지로 누르거나 스스로 해결하려고 애쓰지 마세요.\n나의 좁은 시야로 내린 판단이 틀렸을 수도 있음을 기꺼이 인정해 봅니다.\n그리고 무겁게 쥐고 있던 마음의 짐을, 내 안의 가장 깊고 환한 빛에게 조용히 건네어 줍니다.\n속으로 가만히 되뇌어 보세요.\n'나는 이 상황을 다르게 볼 수 있습니다. 이 감정을 기꺼이 내려놓겠습니다. 나를 대신해 이 마음을 이끌어 주소서.'",
                audioSrc: "audio/step2.mp3"
            },
            {
                indicator: "3단계",
                title: "성령의 시각으로 대체하기",
                script: "내어맡긴 그 빈자리에, 이제 고요하고 맑은 평화가 스며듭니다.\n에고의 시끄러운 목소리가 잦아든 자리에 새로운 시각이 열립니다.\n두려움의 렌즈를 벗고 다시 바라보세요. 진정한 당신에게 상처를 줄 수 있는 것은, 이 세상에 아무것도 없습니다.\n나와 상대방 모두, 어떠한 결핍이나 죄가 없는, 본래부터 완전하고 사랑스러운 존재임을 조용히 받아들입니다.",
                audioSrc: "audio/step3.mp3"
            },
            {
                indicator: "4단계",
                title: "아무것도 하지 않음 (Do Nothing)",
                script: "이제 모든 정화의 과정이 끝났습니다. 당신이 무언가를 더 통제하거나, 더 나아지려 애쓸 필요가 없습니다.\n잘하려는 마음, 용서하려는 그 노력조차 모두 내려놓으세요.\n아무것도 바꿀 필요가 없습니다. 아무것도 판단할 필요가 없습니다.\n그저 생각도, 노력도 멈추고, 지금 이 순간의 텅 빈 고요함 속에 머무릅니다.\n아무것도 하지 않아도, 이미 모든 것이 온전합니다. 이 깊은 평화를 누리세요.",
                audioSrc: "audio/step4.mp3"
            }
        ];

        let currentStep = 0;
        
        let appData = { 
            users: [], 
            currentUser: "", 
            userEvents: {},       
            currentEvents: {},    
            userEventDetails: {}, 
            records: {}           
        };

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('miracleCleanAppData');
            if (saved) {
                try { 
                    const parsed = JSON.parse(saved);
                    appData.users = parsed.users || [];
                    appData.currentUser = parsed.currentUser || "";
                    appData.userEvents = parsed.userEvents || {};
                    appData.currentEvents = parsed.currentEvents || {};
                    appData.userEventDetails = parsed.userEventDetails || {};
                    appData.records = parsed.records || {};

                    if (parsed.events && !appData.userEvents[appData.currentUser]) {
                        appData.userEvents[appData.currentUser] = parsed.events;
                    }
                    if (parsed.currentEvent && !appData.currentEvents[appData.currentUser]) {
                        appData.currentEvents[appData.currentUser] = parsed.currentEvent;
                    }
                    if (parsed.eventDetails && !appData.userEventDetails[appData.currentUser]) {
                        appData.userEventDetails[appData.currentUser] = parsed.eventDetails;
                    }
                } catch(e) {}
            }
            updateSettingsUI();
        }

        function saveToLocalStorage() {
            localStorage.setItem('miracleCleanAppData', JSON.stringify(appData));
        }

        const stepIndicator = document.getElementById('stepIndicator');
        const stepTitle = document.getElementById('stepTitle');
        const scriptText = document.getElementById('scriptText');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const audioEl = document.getElementById('stepAudio');
        const playAudioBtn = document.getElementById('playAudioBtn');
        
        const recordBtn = document.getElementById('recordBtn');
        const recordModal = document.getElementById('recordModal');
        const closeRecordModalBtn = document.getElementById('closeRecordModalBtn');
        const modalTitle = document.getElementById('modalTitle');
        const modalTextarea = document.getElementById('modalTextarea');
        const saveRecordBtn = document.getElementById('saveRecordBtn');

        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettingsModalBtn = document.getElementById('closeSettingsModalBtn');
        
        const userInput = document.getElementById('userInput');
        const registerUserBtn = document.getElementById('registerUserBtn');
        const userSelect = document.getElementById('userSelect');
        const deleteUserBtn = document.getElementById('deleteUserBtn');

        const eventInput = document.getElementById('eventInput');
        const addEventBtn = document.getElementById('addEventBtn');
        const eventSelect = document.getElementById('eventSelect');
        const editEventBtn = document.getElementById('editEventBtn');
        const deleteEventBtn = document.getElementById('deleteEventBtn');
        const eventDetailTextarea = document.getElementById('eventDetailTextarea');

        const ebookModal = document.getElementById('ebookModal');
        const closeEbookModalBtn = document.getElementById('closeEbookModalBtn');
        const ebookChapters = document.getElementById('ebookChapters');
        const ebookDate = document.getElementById('ebookDate');
        const ebookHeaderTitle = document.getElementById('ebookHeaderTitle');
        const ebookPrintArea = document.getElementById('ebookPrintArea');
        const imageShareBtn = document.getElementById('imageShareBtn');

        function updateUI() {
            scriptText.style.opacity = 0;
            setTimeout(() => {
                const step = steps[currentStep];
                stepIndicator.textContent = step.indicator;
                stepTitle.textContent = step.title;
                scriptText.textContent = step.script;

                prevBtn.disabled = currentStep === 0;
                nextBtn.textContent = currentStep === steps.length - 1 ? "요약보기 📖" : "다음 단계";

                audioEl.src = step.audioSrc;
                audioEl.pause();
                playAudioBtn.textContent = "오디오 재생";
                scriptText.style.opacity = 1;
            }, 300);
        }

        function getCurrentEvent() {
            if (!appData.currentUser) return "";
            return appData.currentEvents[appData.currentUser] || "";
        }

        function getCurrentKey() {
            const curEvt = getCurrentEvent();
            if(!appData.currentUser || !curEvt) return null;
            return `${appData.currentUser}_${curEvt}`;
        }

        function getCurrentStepRecord() {
            const key = getCurrentKey();
            if(key && appData.records[key]) {
                const found = appData.records[key].find(r => r.stepIndex === currentStep);
                return found ? found.text : "";
            }
            return "";
        }

        function saveCurrentStepRecord(text) {
            const key = getCurrentKey();
            if(!key) {
                alert("설정에서 사용자와 사건을 먼저 선택/등록해주세요!");
                return false;
            }
            if(!appData.records[key]) appData.records[key] = [];
            const found = appData.records[key].find(r => r.stepIndex === currentStep);
            if(found) {
                found.text = text;
            } else {
                appData.records[key].push({ stepIndex: currentStep, text: text });
            }
            saveToLocalStorage();
            return true;
        }

        function updateSettingsUI() {
            userSelect.innerHTML = '<option value="">사용자를 선택하세요</option>';
            appData.users.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u;
                opt.textContent = u;
                if(u === appData.currentUser) opt.selected = true;
                userSelect.appendChild(opt);
            });

            eventSelect.innerHTML = '<option value="">사건을 선택하세요</option>';
            const userEvts = (appData.currentUser && appData.userEvents[appData.currentUser]) ? appData.userEvents[appData.currentUser] : [];
            const curEvt = getCurrentEvent();

            userEvts.forEach(e => {
                const opt = document.createElement('option');
                opt.value = e;
                opt.textContent = e;
                if(e === curEvt) opt.selected = true;
                eventSelect.appendChild(opt);
            });

            if (appData.currentUser && curEvt && appData.userEventDetails[appData.currentUser]) {
                eventDetailTextarea.value = appData.userEventDetails[appData.currentUser][curEvt] || "";
            } else {
                eventDetailTextarea.value = "";
            }
        }

        playAudioBtn.addEventListener('click', () => {
            if (audioEl.paused) {
                audioEl.play().catch(e => console.log("오디오 경로 확인 필요"));
                playAudioBtn.textContent = "오디오 정지";
            } else {
                audioEl.pause();
                playAudioBtn.textContent = "오디오 재생";
            }
        });

        audioEl.addEventListener('ended', () => { playAudioBtn.textContent = "오디오 재생"; });

        nextBtn.addEventListener('click', () => {
            if (currentStep < steps.length - 1) {
                currentStep++;
                updateUI();
            } else {
                openEbookModal();
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        });

        function openModal(modalEl) {
            modalEl.style.display = "flex";
            setTimeout(() => modalEl.classList.add("show"), 10);
        }

        function closeModal(modalEl) {
            modalEl.classList.remove("show");
            setTimeout(() => { modalEl.style.display = "none"; }, 300);
        }

        window.addEventListener('click', (e) => {
            if (e.target === recordModal) closeModal(recordModal);
            if (e.target === settingsModal) closeModal(settingsModal);
            if (e.target === ebookModal) closeModal(ebookModal);
        });

        openSettingsBtn.addEventListener('click', () => {
            loadFromLocalStorage();
            updateSettingsUI();
            openModal(settingsModal);
        });
        closeSettingsModalBtn.addEventListener('click', () => closeModal(settingsModal));

        registerUserBtn.addEventListener('click', () => {
            const name = userInput.value.trim();
            if(!name) return;
            if(!appData.users.includes(name)) {
                appData.users.push(name);
            }
            appData.currentUser = name;
            userInput.value = "";
            saveToLocalStorage();
            updateSettingsUI();
            alert(`사용자 '${name}'(이)가 등록 및 선택되었습니다.`);
        });

        userSelect.addEventListener('change', () => {
            appData.currentUser = userSelect.value;
            saveToLocalStorage();
            updateSettingsUI();
        });

        deleteUserBtn.addEventListener('click', () => {
            const val = userSelect.value;
            if(!val) { alert("삭제할 사용자를 선택해주세요."); return; }
            appData.users = appData.users.filter(u => u !== val);
            delete appData.userEvents[val];
            delete appData.currentEvents[val];
            delete appData.userEventDetails[val];
            
            if(appData.currentUser === val) {
                appData.currentUser = "";
            }
            saveToLocalStorage();
            updateSettingsUI();
        });

        addEventBtn.addEventListener('click', () => {
            if(!appData.currentUser) {
                alert("먼저 사용자를 선택하거나 등록해주세요!");
                return;
            }
            const evt = eventInput.value.trim();
            if(!evt) return;

            if(!appData.userEvents[appData.currentUser]) {
                appData.userEvents[appData.currentUser] = [];
            }
            if(!appData.userEvents[appData.currentUser].includes(evt)) {
                appData.userEvents[appData.currentUser].push(evt);
            }
            appData.currentEvents[appData.currentUser] = evt;
            eventInput.value = "";

            if(!appData.userEventDetails[appData.currentUser]) {
                appData.userEventDetails[appData.currentUser] = {};
            }
            appData.userEventDetails[appData.currentUser][evt] = "";

            saveToLocalStorage();
            updateSettingsUI();
            alert(`사건 '${evt}'(이)가 추가 및 선택되었습니다.`);
        });

        eventSelect.addEventListener('change', () => {
            if(appData.currentUser) {
                appData.currentEvents[appData.currentUser] = eventSelect.value;
                saveToLocalStorage();
                updateSettingsUI();
            }
        });

        editEventBtn.addEventListener('click', () => {
            if(!appData.currentUser) return;
            const oldEvt = getCurrentEvent();
            if(!oldEvt) { alert("수정할 사건을 선택해주세요."); return; }
            const newEvt = prompt("변경할 사건명을 입력하세요:", oldEvt);
            if(newEvt && newEvt.trim() !== "") {
                const trimmed = newEvt.trim();
                const userEvts = appData.userEvents[appData.currentUser] || [];
                const idx = userEvts.indexOf(oldEvt);
                if(idx !== -1) userEvts[idx] = trimmed;
                appData.currentEvents[appData.currentUser] = trimmed;
                
                if(appData.userEventDetails[appData.currentUser] && appData.userEventDetails[appData.currentUser][oldEvt] !== undefined) {
                    appData.userEventDetails[appData.currentUser][trimmed] = appData.userEventDetails[appData.currentUser][oldEvt];
                    delete appData.userEventDetails[appData.currentUser][oldEvt];
                }

                const oldKey = `${appData.currentUser}_${oldEvt}`;
                const newKey = `${appData.currentUser}_${trimmed}`;
                if(appData.records[oldKey]) {
                    appData.records[newKey] = appData.records[oldKey];
                    delete appData.records[oldKey];
                }

                saveToLocalStorage();
                updateSettingsUI();
            }
        });

        deleteEventBtn.addEventListener('click', () => {
            if(!appData.currentUser) return;
            const val = getCurrentEvent();
            if(!val) { alert("삭제할 사건을 선택해주세요."); return; }
            
            appData.userEvents[appData.currentUser] = (appData.userEvents[appData.currentUser] || []).filter(e => e !== val);
            appData.currentEvents[appData.currentUser] = "";
            if(appData.userEventDetails[appData.currentUser]) {
                delete appData.userEventDetails[appData.currentUser][val];
            }

            saveToLocalStorage();
            updateSettingsUI();
        });

        eventDetailTextarea.addEventListener('input', () => {
            if(!appData.currentUser) return;
            const curEvt = getCurrentEvent();
            if(!curEvt) return;
            if(!appData.userEventDetails[appData.currentUser]) {
                appData.userEventDetails[appData.currentUser] = {};
            }
            appData.userEventDetails[appData.currentUser][curEvt] = eventDetailTextarea.value;
            saveToLocalStorage();
        });

        recordBtn.addEventListener('click', () => {
            const curEvt = getCurrentEvent();
            if(!appData.currentUser || !curEvt) {
                alert("먼저 하단의 [설정] 버튼을 눌러 사용자 이름과 사건명을 설정해주세요!");
                openModal(settingsModal);
                return;
            }
            modalTitle.textContent = `${steps[currentStep].indicator} 느낌 기록하기 (${appData.currentUser} / ${curEvt})`;
            modalTextarea.value = getCurrentStepRecord(); 
            openModal(recordModal);
        });

        closeRecordModalBtn.addEventListener('click', () => closeModal(recordModal));

        saveRecordBtn.addEventListener('click', () => {
            const success = saveCurrentStepRecord(modalTextarea.value);
            if(!success) return;
            
            const originalText = saveRecordBtn.textContent;
            saveRecordBtn.textContent = "저장되었습니다 ✔";
            saveRecordBtn.style.backgroundColor = "#4CAF50";
            
            setTimeout(() => {
                saveRecordBtn.textContent = originalText;
                saveRecordBtn.style.backgroundColor = "var(--accent)";
                closeModal(recordModal);
            }, 1000);
        });

        closeEbookModalBtn.addEventListener('click', () => closeModal(ebookModal));

        function openEbookModal() {
            const curEvt = getCurrentEvent();
            if(!appData.currentUser || !curEvt) {
                alert("사용자와 사건 정보가 없습니다. 설정을 먼저 확인해주세요.");
                openModal(settingsModal);
                return;
            }

            ebookHeaderTitle.textContent = `${appData.currentUser}의 내면 정화 일지`;
            
            const today = new Date();
            const detailsMap = appData.userEventDetails[appData.currentUser] || {};
            const eventDesc = detailsMap[curEvt] ? detailsMap[curEvt] : "내용 없음";
            ebookDate.innerHTML = `사건: [${curEvt}]<br>사건 내용: ${eventDesc}<br>기록일: ${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일`;

            ebookChapters.innerHTML = "";
            const key = getCurrentKey();
            const userRecords = (key && appData.records[key]) ? appData.records[key] : [];

            steps.forEach((step, idx) => {
                const chapterDiv = document.createElement('div');
                chapterDiv.className = 'ebook-chapter';
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'ebook-chapter-title';
                titleDiv.textContent = `${step.indicator} : ${step.title}`;
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'ebook-chapter-content';
                
                const found = userRecords.find(r => r.stepIndex === idx);
                if(!found || found.text.trim() === "") {
                    contentDiv.innerHTML = `<span class="empty-record">이 단계에는 작성된 기록이 없습니다.</span>`;
                } else {
                    contentDiv.textContent = found.text;
                }

                chapterDiv.appendChild(titleDiv);
                chapterDiv.appendChild(contentDiv);
                ebookChapters.appendChild(chapterDiv);
            });

            openModal(ebookModal);
        }

        // 일지 내용을 이미지로 변환하여 메신저(카카오톡 등)로 바로 공유하는 기능
        imageShareBtn.addEventListener('click', () => {
            const closeBtn = ebookPrintArea.querySelector('.close-btn');
            const shareBtn = ebookPrintArea.querySelector('.image-share-btn');
            closeBtn.style.display = 'none';
            shareBtn.style.display = 'none';

            html2canvas(ebookPrintArea, {
                backgroundColor: "#1e1e1e",
                scale: 2
            }).then(canvas => {
                closeBtn.style.display = 'block';
                shareBtn.style.display = 'block';

                canvas.toBlob(blob => {
                    const file = new File([blob], `${appData.currentUser}_내면정화일지.png`, { type: 'image/png' });

                    // Web Share API 지원 여부 확인 (모바일 카카오톡 등에서 이미지 바로 공유 가능)
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({
                            files: [file],
                            title: '나의 내면 정화 일지',
                            text: `${appData.currentUser}의 내면 정화 일지 이미지 공유입니다.`
                        }).catch(error => {
                            console.log('공유 취소 또는 실패', error);
                        });
                    } else {
                        // 미지원 환경(PC 등)일 경우 파일 다운로드로 대체
                        const link = document.createElement('a');
                        link.download = `${appData.currentUser}_내면정화일지.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                        alert("이 브라우저는 직접 공유를 지원하지 않아 이미지 파일로 다운로드되었습니다.");
                    }
                }, 'image/png');
            }).catch(err => {
                closeBtn.style.display = 'block';
                shareBtn.style.display = 'block';
                alert("이미지 공유 중 오류가 발생했습니다.");
            });
        });

        loadFromLocalStorage();
        updateUI();
    </script>
</body>
</html>
